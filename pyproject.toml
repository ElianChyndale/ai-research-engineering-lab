[project]
name = "ai-research-engineering-lab"
version = "0.2.0"
description = "Deterministic AI research-engineering laboratory for learning ML/IR foundations."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "mypy>=1.8,<2.0",
  "ruff>=0.3,<1.0",
]
torch = [
  "torch>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: unit tests (no I/O, no subprocess)",
  "integration: integration tests (subprocess, file I/O)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
